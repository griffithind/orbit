# Development Postgres. Not a deployment artifact.
#
# Port 5433 avoids colliding with a Postgres already running on the host.
services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-pg
    environment:
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit"]
      interval: 1s
      timeout: 3s
      retries: 30
    # Development only: no volume, so `make db-down` gives a clean slate.
