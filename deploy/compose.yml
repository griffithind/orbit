# The control plane, as two containers.
#
# MOST PEOPLE SHOULD NOT RUN THIS BY HAND. scripts/setup-control-plane.sh does
# every step below, generates the secrets, opens the ports, and mints the
# break-glass token — it is the supported path, and this file is what it drives.
# Read on only if you are adapting it.
#
#   1. Put a passphrase in ./ca-pass and a database password in ./.env
#   2. docker compose run --rm orbitd migrate -app-password "$POSTGRES_APP_PASSWORD"
#   3. docker compose run --rm orbitd bootstrap -network prod -cidr 10.42.0.0/16
#      (the CA key is sealed into Postgres under ORBIT_KEK_PASSPHRASE; no file
#      is written and no volume holds it)
#   4. Put the printed network id in ./.env as ORBIT_NETWORK
#   5. docker compose up -d
#
# Steps 2 and 3 print things you need. Everything else is this file.
#
# The admin CLI is in the same image and needs no second install:
#
#   docker compose run --rm orbit host create -name web-01 -addr 10.42.0.7 -role default
#   docker compose run --rm orbit host code web-01

name: orbit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: orbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on LOOPBACK ONLY, and it has to be published at all because
    # orbitd runs with network_mode: host — which takes it off this compose
    # network entirely, so it cannot reach a service by name. Without this the
    # DSNs below point at a host loopback where nothing listens, and every
    # orbitd command fails with "connection refused" against a Postgres that is
    # demonstrably healthy.
    #
    # 127.0.0.1 rather than a bare 5432: the second form binds every interface,
    # which would put the database on the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  orbitd:
    image: ghcr.io/griffithind/orbit:${ORBIT_VERSION:-latest}
    build:
      context: ..
      args:
        VERSION: ${ORBIT_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    # Host networking, and it is not optional. Nebula punches holes and hands
    # out the address it believes it is reachable at; behind a NAT bridge it
    # would advertise a container address and every host would dial somewhere
    # that does not exist. This also means 4242/udp and 8080/tcp are bound on
    # the host directly, so the host firewall is what governs them.
    network_mode: host

    environment:
      ORBIT_DSN: postgres://orbit_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@127.0.0.1:5432/orbit?sslmode=disable
      ORBIT_ADMIN_DSN: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD}@127.0.0.1:5432/orbit?sslmode=disable
      ORBIT_NETWORK: ${ORBIT_NETWORK:-}
      # Encrypts the CA and identity keys at rest in Postgres. The database
      # never sees it, which is the entire point: a leaked dump is useless
      # without it, and losing it makes every stored key unreadable.
      ORBIT_KEK_PASSPHRASE: ${ORBIT_KEK_PASSPHRASE:?set ORBIT_KEK_PASSPHRASE in .env}
      # A path, never the value. The passphrase stays out of the environment,
      # out of `docker inspect`, and out of anything that dumps a container's
      # config.
      ORBIT_CA_KEY_PASSPHRASE_FILE: /run/secrets/ca-pass

    secrets:
      - ca-pass

    command:
      - serve
      - -addr=0.0.0.0:8080
      - -metrics-addr=127.0.0.1:9464
      - -ui-addr=127.0.0.1:8081
      - -enroll-url=${ORBIT_ENROLL_URL:?set ORBIT_ENROLL_URL in .env}
      - -mesh=${ORBIT_NETWORK:-}=${ORBIT_OVERLAY_ADDR:-10.42.0.1}
      - -lighthouse=${ORBIT_PUBLIC_ADDR:?set ORBIT_PUBLIC_ADDR in .env, as host:4242}

  # The admin CLI, from the same image.
  #
  # It was always in the image and effectively unreachable: `docker compose run
  # --rm orbitd orbit host code web-01` swallows "orbit" as an argument to
  # orbitd's entrypoint and prints orbitd's usage, which reads exactly like the
  # binary not being there.
  #
  # A profile so `docker compose up` does not try to start it — it is a command
  # that runs and exits, not a service. `docker compose run` enables a targeted
  # service's profile on its own, so no --profile flag is needed:
  #
  #   docker compose run --rm orbit host create -name web-01 -addr 10.42.0.7 -role default
  #   docker compose run --rm orbit host code web-01
  #   docker compose run --rm orbit converge
  #
  # host networking so 127.0.0.1:8080 is the control plane next to it, and so
  # ORBIT_URL needs no value in the common case.
  orbit:
    profiles: [cli]
    image: ghcr.io/griffithind/orbit:${ORBIT_VERSION:-latest}
    network_mode: host
    entrypoint: ["/usr/local/bin/orbit"]
    environment:
      ORBIT_URL: ${ORBIT_ADMIN_URL:-http://127.0.0.1:8080}
      # Pass with -e on the command line, or put it in .env. Neither is worse
      # than the database password already there.
      ORBIT_TOKEN: ${ORBIT_TOKEN:-}
      ORBIT_NETWORK: ${ORBIT_NETWORK:-}
      # Encrypts the CA and identity keys at rest in Postgres. The database
      # never sees it, which is the entire point: a leaked dump is useless
      # without it, and losing it makes every stored key unreadable.
      ORBIT_KEK_PASSPHRASE: ${ORBIT_KEK_PASSPHRASE:?set ORBIT_KEK_PASSPHRASE in .env}

secrets:
  ca-pass:
    file: ./ca-pass

volumes:
  # THE root of trust now lives here, and nowhere else.
  #
  # The CA key and the network identity key are rows in Postgres, sealed under
  # ORBIT_KEK_PASSPHRASE — there is no key file and no `cakey` volume any more.
  # That means a backup is TWO things, kept apart:
  #
  #   1. this volume (or a pg_dump of it)
  #   2. ORBIT_KEK_PASSPHRASE, from .env
  #
  # Either alone is worthless, which is the design: a leaked dump cannot mint a
  # certificate. Losing the passphrase destroys the network as surely as losing
  # the database — nebula has no intermediate CAs, so every host re-enrolls by
  # hand. See docs/key-custody.md.
  pgdata:
