name: CI

on:
  push:
    branches: [main]
  pull_request:

# The e2e suite builds real nebula tunnels and talks to a real Postgres. There
# is no mock layer to run instead, deliberately: the constraints this project is
# built around (no intermediate CAs, blocklist checked per tunnel, config
# directory merge semantics) live in nebula's code, and a mock would encode our
# belief about them rather than the behaviour.

env:
  PG_IMAGE: postgres:17-alpine

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORBIT_TEST_DSN: postgres://postgres:orbit@localhost:5433/orbit?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          # nebula is built from the pinned submodule that go.mod's
          # replace points at. Without this the directory is empty and
          # every build fails on a missing module rather than on
          # anything to do with the change being tested.
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::these files need gofmt"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # Every platform, because build tags hide breakage from the platforms you
      # do build. Splitting the agent left dns_other.go behind in the old
      # package; its //go:build !linux && !darwin meant neither this runner nor
      # a developer Mac compiled it, and hostcfg was broken on every other OS
      # while CI stayed green. Compiling is all this checks — the tests below
      # still only run on the host platform — but a missing symbol is exactly
      # the class of error a move introduces.
      - name: build on every platform we tag for
        run: |
          for os in linux darwin freebsd windows; do
            echo "── GOOS=$os"
            GOOS=$os GOARCH=amd64 go build ./... || exit 1
          done

      # Reachability, not coverage. See docs/adr/0006-code-must-be-reachable.md.
      #
      # Scoped to ./cmd/... deliberately: ./... counts a test as a caller, and
      # that blind spot is what let Loop.Run — the push channel, the config
      # self-heal and host reconciliation, some 1,200 lines — ship fully tested
      # and never executed by the daemon, while e2e measured a path production
      # does not take.
      - name: no unreachable code
        run: |
          go run golang.org/x/tools/cmd/deadcode@latest -test ./cmd/... > found.txt || true
          # Match on package-qualified name, not the bare identifier: Status,
          # Describe and Restart each name methods on several types, and
          # allowing one would silently allow all of them.
          sed -nE 's#^([^:]+):[0-9]+:[0-9]+: unreachable func: (.+)$#\1 \2#p' found.txt \
            | sort -u > found-names.txt
          # Each entry carries its reason after a '#'. Strip it, and the
          # surrounding space, so what is compared is the name alone.
          sed -E 's/#.*$//; s/[[:space:]]+$//' .github/deadcode-allow.txt \
            | grep -vE '^[[:space:]]*$' | sort -u > allowed.txt
          if comm -23 found-names.txt allowed.txt | grep -q .; then
            echo "Unreachable from the binaries, and not in .github/deadcode-allow.txt:"
            comm -23 found-names.txt allowed.txt | sed 's/^/  /'
            echo
            echo "Wire it or delete it — see docs/adr/0006-code-must-be-reachable.md."
            echo "The allow file is for code the analysis cannot see: other platforms,"
            echo "reflection. Not for code whose caller is coming later."
            exit 1
          fi

      # The second gate, and it catches what the first structurally cannot.
      #
      # The gate above is scoped to ./cmd/... so that a test does not count as a
      # caller. The cost of that scope is that it says nothing about code which
      # NOTHING calls — not production, not tests — because such code is already
      # unreachable from ./cmd/... and sits behind an allow-file entry that was
      # added for a different reason.
      #
      # This one is the complement: unreachable even when every test counts as a
      # root. There is no allow file, because there is no honest reason for a
      # function that nothing in the repository calls to exist. It found six the
      # day it was added, one of which was a test helper duplicated into a second
      # package by the agent split and never called there.
      - name: no code that nothing calls
        run: |
          go run golang.org/x/tools/cmd/deadcode@latest -test ./... > all.txt || true
          if grep -q 'unreachable func:' all.txt; then
            echo "These functions are called by nothing at all, tests included:"
            sed -nE 's#^(.+): unreachable func: (.+)$#  \2  (\1)#p' all.txt
            echo
            echo "Delete them. See docs/adr/0006-code-must-be-reachable.md."
            exit 1
          fi

      # Uninstrumented, and that is required rather than merely convenient:
      # e2e/revocation_test.go asserts a propagation deadline, and under -race
      # that assertion measures the race detector instead of the system.
      - name: test
        run: go test ./... -count=1 -timeout 10m

      # The version the README tells people to install must have notes. Checked
      # on every push, because the alternative is finding out at tag time, which
      # is the moment it is most expensive to fix.
      - name: the changelog is readable and its newest section is not empty
        run: |
          set -eu
          v=$(./scripts/changelog-latest.sh)
          ./scripts/changelog-section.sh "$v" > /dev/null
          echo "CHANGELOG.md describes $v"

      # Here and not only in the release workflow. This check first ran at
      # release time, found that the generator's output depended on the local
      # module cache, and failed the release — correct, but the wrong moment to
      # learn it. A check that only runs on a tag is a check whose first
      # feedback is a broken release.
      - name: third-party notices are current
        run: |
          ./scripts/third-party-notices.sh
          if ! git diff --quiet THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is stale; run make third-party"
            git diff THIRD-PARTY-NOTICES.md
            exit 1
          fi

      # The store and e2e tests skip themselves when Postgres is unreachable,
      # which is right on a laptop and wrong here: a broken DSN would turn the
      # suite green while testing nothing.
      - name: fail on silently skipped database tests
        run: |
          go test ./e2e/ ./internal/store/ -count=1 -v 2>&1 | tee out.txt
          if grep -q "postgres unavailable" out.txt; then
            echo "::error::database tests skipped; CI must not pass without them"
            exit 1
          fi

  race:
    name: race
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORBIT_TEST_DSN: postgres://postgres:orbit@localhost:5433/orbit?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          # nebula is built from the pinned submodule that go.mod's
          # replace points at. Without this the directory is empty and
          # every build fails on a missing module rather than on
          # anything to do with the change being tested.
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Scoped on purpose. Every piece of shared mutable state on the hot path
      # is directly tested:
      #
      #   internal/notify   subscriber fan-out under subscribe/release churn
      #   internal/api      the enrollment limiter's key map
      #   internal/agent    the apply/renew loop's state
      #   internal/store    pool handling
      #   cmd/orbit         the agent's status socket, answering from its own
      #                     goroutine while the tick and the setup retry mutate
      #                     what it reports
      #
      # cmd/... is in scope despite holding almost no logic, because that one
      # piece of it IS concurrent and its types are in package main — they
      # cannot move into internal/ without dragging the whole run loop along.
      # It costs about a second.
      #
      # Running -race over ./e2e/ as well was measured at roughly 100x: a 0.5s
      # test took 57s, because the detector instruments every one of nebula's
      # in-process tunnel goroutines. That buys almost no additional coverage —
      # the same primitives, reached through a slower path — for a 25-minute PR
      # gate, so the fan-out gets a direct unit test instead.
      - name: race
        run: go test ./internal/... ./cmd/... -count=1 -race -timeout 10m
